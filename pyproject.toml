[project]
name = "drf-log-writer"
version = "1.2.0"
description = "Log every Django/DRF request and response as JSON to files and/or the database, with key-based hashing, search, and a column-based admin viewer."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = ["Django>=4.2"]
keywords = ["django", "djangorestframework", "logging", "request-log", "audit"]
classifiers = [
    "Framework :: Django",
    "Framework :: Django :: 4.2",
    "Framework :: Django :: 5.0",
    "Framework :: Django :: 5.1",
    "Framework :: Django :: 5.2",
    "Programming Language :: Python :: 3",
]

[project.urls]
Homepage = "https://github.com/arasheghdam84/drf-log-writter"
Issues = "https://github.com/arasheghdam84/drf-log-writter/issues"
Repository = "https://github.com/arasheghdam84/drf-log-writter"

[project.optional-dependencies]
drf = ["djangorestframework>=3.14"]

[dependency-groups]
dev = [
    "djangorestframework>=3.14",
    "pytest>=8",
    "pytest-django>=4.8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["drf_log_writer"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "tests.settings"
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py310"
extend-exclude = ["*/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
